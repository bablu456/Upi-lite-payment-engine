version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: upi_postgres_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=bablu
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=upidb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
# Copy this file to application-local.properties (gitignored) and replace values.
# Only application-local.properties is loaded by Spring in this project.

# Database
DB_URL=jdbc:postgresql://localhost:5433/upidb?options=-c%20timezone=Asia/Kolkata
DB_USERNAME=bablu
DB_PASSWORD=password

# JWT
JWT_SECRET_KEY=77397A24432646294A404E635266556A586E3272357538782F413F442847284B
JWT_EXPIRATION_MS=86400000

# Kafka
KAFKA_BOOTSTRAP_SERVERS=localhost:9092

# Kafka toggle:
# true  -> use Kafka notifications (requires broker running)
# false -> deploy without Kafka; transfer flow stays fast, notifications are skipped
APP_KAFKA_ENABLED=true

# OTP policy
OTP_EXPIRY_MINUTES=5
OTP_MAX_ATTEMPTS=5
OTP_EMAIL_ENABLED=true

# SMTP (Gmail: use App Password, not account password)
MAIL_HOST=smtp.gmail.com
MAIL_PORT=587
MAIL_USERNAME=your-email@gmail.com
MAIL_PASSWORD=your-16-char-app-password
MAIL_FROM=your-email@gmail.com

# AI Assistant
AI_ASSISTANT_ENABLED=true
OPENAI_API_KEY=your-openai-api-key
OPENAI_MODEL=gpt-4o-mini
AI_MAX_HISTORY=8
AI_TEMPERATURE=0.4
AI_MAX_TOKENS=350

# Rate limiting
APP_RATE_LIMIT_ENABLED=true
RATE_LIMIT_OTP_REQUEST_MAX_ATTEMPTS=5
RATE_LIMIT_OTP_REQUEST_WINDOW_SECONDS=300
RATE_LIMIT_OTP_VERIFY_MAX_ATTEMPTS=10
RATE_LIMIT_OTP_VERIFY_WINDOW_SECONDS=300
RATE_LIMIT_PASSWORD_RESET_REQUEST_MAX_ATTEMPTS=5
RATE_LIMIT_PASSWORD_RESET_REQUEST_WINDOW_SECONDS=600
RATE_LIMIT_PASSWORD_RESET_VERIFY_MAX_ATTEMPTS=8
RATE_LIMIT_PASSWORD_RESET_VERIFY_WINDOW_SECONDS=600
RATE_LIMIT_TRANSFER_MAX_ATTEMPTS=20
RATE_LIMIT_TRANSFER_WINDOW_SECONDS=60
RATE_LIMIT_WALLET_CREDIT_MAX_ATTEMPTS=12
RATE_LIMIT_WALLET_CREDIT_WINDOW_SECONDS=60
RATE_LIMIT_DISPUTE_RAISE_MAX_ATTEMPTS=8
RATE_LIMIT_DISPUTE_RAISE_WINDOW_SECONDS=600

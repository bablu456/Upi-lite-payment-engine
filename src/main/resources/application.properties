spring.application.name=UPI-Lite-Engine

# Optional local overrides (ignored by git) for secrets.
spring.config.import=optional:file:./application-local.properties,optional:file:./src/main/resources/application-local.properties


# Docker Local Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/upidb?options=-c%20timezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:bablu}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Virtual Threads (Java 21 Feature)
spring.threads.virtual.enabled=true

# --- KAFKA CONFIGURATION ---
# Deployment switch:
# APP_KAFKA_ENABLED=true  -> full event mode (producer + consumer + topic bean)
# APP_KAFKA_ENABLED=false -> API still works, Kafka notifications are safely skipped
app.kafka.enabled=${APP_KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Swagger/OpenAPI Configuration for Spring Boot 4
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false

# --- SECURITY CONFIGURATION ---
# Configure via env/local file in non-dev environments.
application.security.jwt.secret-key=${JWT_SECRET_KEY:dXBpLWxpdGUtZGV2LXNlY3JldC1rZXktY2hhbmdlLW1lLTIwMjYtdXBpLWxpdGU=}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# --- OTP CONFIGURATION ---
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.email.enabled=${OTP_EMAIL_ENABLED:false}
app.otp.email.from=${MAIL_FROM:no-reply@upilite.local}

# --- SMTP (set these for real OTP emails) ---

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- AI ASSISTANT CONFIGURATION ---
app.ai.enabled=${AI_ASSISTANT_ENABLED:true}
app.ai.openai.api-key=${OPENAI_API_KEY}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.openai.chat-url=${OPENAI_CHAT_URL:https://api.openai.com/v1/chat/completions}
app.ai.max-history=${AI_MAX_HISTORY:8}
app.ai.temperature=${AI_TEMPERATURE:0.4}
app.ai.max-tokens=${AI_MAX_TOKENS:350}

# --- REQUEST TRACING / LOGGING ---
logging.pattern.level=%5p [requestId:%X{requestId}]

# --- RATE LIMITING (PHASE-1 SAFETY) ---
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.otp-request.max-attempts=${RATE_LIMIT_OTP_REQUEST_MAX_ATTEMPTS:5}
app.rate-limit.otp-request.window-seconds=${RATE_LIMIT_OTP_REQUEST_WINDOW_SECONDS:300}
app.rate-limit.otp-verify.max-attempts=${RATE_LIMIT_OTP_VERIFY_MAX_ATTEMPTS:10}
app.rate-limit.otp-verify.window-seconds=${RATE_LIMIT_OTP_VERIFY_WINDOW_SECONDS:300}
app.rate-limit.password-reset-request.max-attempts=${RATE_LIMIT_PASSWORD_RESET_REQUEST_MAX_ATTEMPTS:5}
app.rate-limit.password-reset-request.window-seconds=${RATE_LIMIT_PASSWORD_RESET_REQUEST_WINDOW_SECONDS:600}
app.rate-limit.password-reset-verify.max-attempts=${RATE_LIMIT_PASSWORD_RESET_VERIFY_MAX_ATTEMPTS:8}
app.rate-limit.password-reset-verify.window-seconds=${RATE_LIMIT_PASSWORD_RESET_VERIFY_WINDOW_SECONDS:600}
app.rate-limit.transfer.max-attempts=${RATE_LIMIT_TRANSFER_MAX_ATTEMPTS:20}
app.rate-limit.transfer.window-seconds=${RATE_LIMIT_TRANSFER_WINDOW_SECONDS:60}
app.rate-limit.wallet-credit.max-attempts=${RATE_LIMIT_WALLET_CREDIT_MAX_ATTEMPTS:12}
app.rate-limit.wallet-credit.window-seconds=${RATE_LIMIT_WALLET_CREDIT_WINDOW_SECONDS:60}
app.rate-limit.dispute-raise.max-attempts=${RATE_LIMIT_DISPUTE_RAISE_MAX_ATTEMPTS:8}
app.rate-limit.dispute-raise.window-seconds=${RATE_LIMIT_DISPUTE_RAISE_WINDOW_SECONDS:600}

spring.application.name=UPI-Lite-Engine

# Optional local overrides (ignored by git) for secrets.
spring.config.import=optional:file:./application-local.properties,optional:file:./src/main/resources/application-local.properties


# Docker Local Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/upidb?options=-c%20timezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:bablu}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Virtual Threads (Java 21 Feature)
spring.threads.virtual.enabled=true

# --- KAFKA CONFIGURATION ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Swagger/OpenAPI Configuration for Spring Boot 4
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false

# --- SECURITY CONFIGURATION ---
# Configure via env/local file in non-dev environments.
application.security.jwt.secret-key=${JWT_SECRET_KEY:dXBpLWxpdGUtZGV2LXNlY3JldC1rZXktY2hhbmdlLW1lLTIwMjYtdXBpLWxpdGU=}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# --- OTP CONFIGURATION ---
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.email.enabled=${OTP_EMAIL_ENABLED:false}
app.otp.email.from=${MAIL_FROM:no-reply@upilite.local}

# --- SMTP (set these for real OTP emails) ---

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
